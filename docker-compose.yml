# Projeto ShopBrasil - Airflow 2.9 (LocalExecutor) + Postgres analítico
# Portas escolhidas para NÃO conflitar com outros ambientes Airflow (8080/5432/5433):
#   Airflow UI -> http://localhost:8081 | Postgres analítico -> localhost:5434
name: shopbrasil-airflow

x-airflow-common: &airflow-common
  build: .
  image: shopbrasil-airflow:1.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__SECRET_KEY: shopbrasil-dev-secret-change-me
    # Connection do Airflow (URI) usada pelo PostgresHook (conn_id = postgres_analytics)
    AIRFLOW_CONN_POSTGRES_ANALYTICS: postgresql://analytics:analytics@postgres-analytics:5432/ecommerce
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./tests:/opt/airflow/tests
  depends_on:
    postgres-meta:
      condition: service_healthy
    postgres-analytics:
      condition: service_healthy

services:
  postgres-meta:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - shopbrasil-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  postgres-analytics:
    image: postgres:16
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: ecommerce
    ports:
      - "5434:5432"
    volumes:
      - shopbrasil-analytics-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics", "-d", "ecommerce"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname ShopBrasil --role Admin --email admin@shopbrasil.local || true
        airflow pools set ecommerce_pool 2 "Limita concorrência das tasks mapeadas por categoria"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  shopbrasil-meta-data:
  shopbrasil-analytics-data:
